<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">反脆弱</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">纳西姆·尼古拉斯·塔勒布</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">区分三种承压方式</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">不被打垮与因变化而改善，是不同的性质。判断系统时，要观察它面对</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">多次冲击后的实际变化，而不只看一次表现。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">控制试错的代价</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">一些探索能把损失限制在局部，却保留发现新机会的可能。关键在于识</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">别边界，避免把无法承受的风险伪装成勇敢尝试。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">追问风险由谁承担</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">提出方案的人若不承担失败代价，决策就可能偏离实际后果。阅读制度</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">案例时，留意收益与损失是否落在同一批人身上。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>