<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">白夜行</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">东野圭吾</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">从旁观者拼出人物</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">主角的内心并不直接向读者敞开。周围人的观察、言语与遭遇，构成一</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">块块不完整的拼图，也留下需要反复核对的空白。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">追踪细节的回声</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">时间跨度很长，早期出现的物件和关系可能在后来获得新意义。留意反</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">复出现的细节，能看见悬念怎样逐渐累积。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">看见行为的代价</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">理解人物的伤痛并不能消除其行为造成的后果。沿着不同人的遭遇阅读</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">，可以同时辨认动机、责任与被牵连者的处境。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>