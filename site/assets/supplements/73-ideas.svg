<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">霍乱时期的爱情</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">加夫列尔·加西亚·马尔克斯</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">把爱情放回时间</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">青春时的迷恋、婚姻中的相处与晚年的相遇，各有不同需要。比较这些</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">阶段，能够看见爱怎样被记忆、身体和处境改变。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">等待也可能自欺</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">长久的执念可以显得深情，也可能遮蔽他人的意愿和自己的行为。小说</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">容纳这种矛盾，需要同时检视动人的表述与实际行动。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">日常也是关系内容</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">婚姻不只有高潮，也包含习惯、摩擦和彼此依赖。注意这些普通场景，</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">才能理解激情之外的亲密如何被维持或消耗。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>