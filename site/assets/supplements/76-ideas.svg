<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">人生海海</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">麦家</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">区分传闻与见证</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">关于上校的故事来自不同讲述者，立场与了解程度并不相同。阅读时记</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">录谁在说、亲见多少，有助于辨认叙述里的偏见。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">秘密关系到尊严</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">好奇心会推动故事，也可能成为伤害他人的力量。小说让人反思：知道</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">真相的欲望，是否总比一个人的边界更重要。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">宽恕不是抹去伤害</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">人物在漫长岁月中重新理解彼此，不代表过去的伤害没有发生。留意照</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">料、理解与沉默如何改变关系，又留下哪些难题。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>