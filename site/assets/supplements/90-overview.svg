<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">事实</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">汉斯·罗斯林、欧拉·罗斯林、安娜·罗斯林·伦朗德</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">我们对世界的印象，跟数据相差多远？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">汉斯·罗斯林与合作者从常见的世界知识误判出发，解释人们如何</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">被二分、负面、恐惧和紧迫感牵着走。书中借公共卫生与发展数据</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">，示范怎样看比例、比较群体并辨认长期变化。它提醒读者在关心</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">现实问题的同时，检查自己使用的尺度与证据。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>