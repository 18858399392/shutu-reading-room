<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">苏东坡传</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">林语堂</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">怎样从诗文之外，理解苏轼的起伏人生？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">林语堂以充满个人理解的笔触书写苏轼，把诗文创作、仕途起落、</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">亲友关系与日常趣味联系起来。读者看到的不只是文学史上的名字</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">，还有一个在不同处境中生活和创造的人。这是一部具有鲜明作者</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">视角的传记，适合沿着作品与人生的联系进入苏轼。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>