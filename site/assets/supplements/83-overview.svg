<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">你当像鸟飞往你的山</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">塔拉·韦斯特弗</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">当新的认识与家庭叙述冲突时，怎样寻找自己的声音？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">塔拉回忆自己在美国爱达荷州一个与主流教育保持距离的家庭中成</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">长，后来通过学习进入大学，逐渐重新理解家庭与世界。教育带来</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">的不仅是知识，也有身份认同和亲密关系上的冲突。这部回忆录写</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">一个人如何在忠诚、记忆与自主之间艰难地建立判断。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>