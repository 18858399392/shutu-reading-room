<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">爱的艺术</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">埃里希·弗洛姆</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">关心落实在行动</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">爱的表达需要进入具体生活。关注对方的处境、愿意了解真实需要，比</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">仅仅确认自己是否拥有强烈感受更接近实践。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">尊重彼此的独立</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">尊重意味着承认对方拥有自己的生活与发展方向。关心不等于控制，关</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">系也需要为差异、选择和成长留下空间。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">能力需要持续练习</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">作者强调专注、耐心与自我认识。与其等待关系自动变好，可以从倾听</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">、履行承诺和反思自身期待开始练习。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>