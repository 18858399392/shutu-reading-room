<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">苏东坡传</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">林语堂</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">作品与处境相互照亮</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">诗词文章产生于具体的人生阶段。知道写作时的地点、交往与遭遇，可</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">以帮助理解文字中的情绪，也能避免只凭名句想象作者。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">起伏中仍有日常生活</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">仕途之外还有家人、朋友、饮食和山水。传记把这些层面放在一起，让</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">读者看见一个人如何在限制中继续安排生活。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">辨认传记作者的视角</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">传记会选择材料，也会作出解释。留意林语堂欣赏什么、如何组织故事</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">，可以同时认识苏轼的经历与这部书的叙述特点。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>