<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">许三观卖血记</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">余华</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">重复里面有变化</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">每一次卖血都有不同的缘由和代价。把这些段落前后比较，就能看见人</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">物的身体、家庭关系与责任感怎样逐渐改变。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">父亲不只是血缘</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">小说反复让亲生与照料发生冲突。谁在具体困难中承担、付出和保护，</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">逐渐成为理解父亲身份比血缘更重要的线索。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">笑声后面是生活</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">日常对话和重复场景常常令人发笑，却又指向匮乏与无奈。留意幽默怎</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">样让人物保有活气，而不是消除痛苦的重量。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>