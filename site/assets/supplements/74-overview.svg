<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">追风筝的人</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">卡勒德·胡赛尼</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">一个人如何面对童年的背叛与未完成的责任？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">阿米尔与哈桑在喀布尔一起长大，却因家庭地位和族群身份处在不</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">平等的位置。一次童年事件留下长久的负疚，战争与流亡又把故乡</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">推向远方。胡赛尼让私人记忆与阿富汗的动荡相互交织，追问重新</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">面对过去之后，赎罪能否变成具体的行动。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>