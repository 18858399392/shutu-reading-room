<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">贫穷的本质</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">阿比吉特·班纳吉、埃斯特·迪弗洛</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">把选择放回处境</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">外人看似费解的决定，可能有现实的风险和成本。先理解收入波动、信</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">息不足和公共服务条件，再讨论一个选择为何发生。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">用研究检验直觉</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">一种政策听起来合理，不等于实施后一定有效。比较实际结果、研究设</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">计和适用人群，能让讨论从立场走向可检验的证据。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">大问题从小处拆解</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">疫苗接种、学校出勤和储蓄习惯各有不同障碍。找出具体环节的阻力，</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">比寻找一种包治所有贫困问题的办法更有帮助。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>