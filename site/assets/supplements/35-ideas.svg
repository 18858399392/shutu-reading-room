<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">我的母亲做保洁</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">张小满</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">看见劳动的重量</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">干净的办公室和楼道，来自具体的人付出的时间与体力。把视线从服务</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">结果移向劳动者，才能看见他们的收入、风险与需要。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">亲近也需要理解</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">母女关系并不自动带来相互理解。教育、经历和表达方式的差异，需要</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">在一次次倾听和具体相处中慢慢被辨认。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">城市里的归属感</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">一个人在城市工作多年，也未必获得稳定的生活位置。跟随母亲的经历</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">，可以观察工作、年龄与城乡身份怎样交织。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>