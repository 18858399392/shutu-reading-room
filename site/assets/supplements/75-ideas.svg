<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">小王子</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">安托万·德·圣埃克苏佩里</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">重新看大人的忙碌</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">国王、商人和其他人物各自执着于某件事。沿着小王子的疑问读，可以</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">重新检查那些被当作理所当然的目标究竟有什么意义。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">关系来自共同时间</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">玫瑰的独特不仅来自外表，还来自照料与牵挂。故事让抽象的爱变成花</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">费时间、建立联系和愿意承担责任的具体经验。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">童话容纳离别</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">明亮的语言中也有孤独和失去。不要急着把故事压缩成几句道理，留意</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">那些没有被完全解释的场景，给自己的感受留下空间。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>