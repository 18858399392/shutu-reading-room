<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">终身成长</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">卡罗尔·德韦克</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">把表现与身份分开</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">一次考试或工作结果，只能反映特定条件下的表现。把失败直接解释为</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">自己不行，会遮住仍可改进的知识和策略。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">努力需要有效方法</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">重复无效做法并不等于成长。把反馈用于检查方法，寻找资源和帮助，</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">才能让投入逐渐转化为可以观察的进步。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">让反馈指向行动</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">与其只给聪明或笨的标签，不如描述具体过程、选择和改进方向。可以</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">行动的反馈，更能帮助人继续面对挑战。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>