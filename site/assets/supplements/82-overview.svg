<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">红楼梦</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">曹雪芹（通行本后四十回续作者有争议）</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">一个家族的繁华，怎样在日常生活里显出裂缝？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">小说以贾府生活为中心，写贾宝玉、林黛玉、薛宝钗等人的情感与</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">命运，也描绘家族秩序、经济开支和众多女性的处境。诗词、宴饮</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">与琐细对话共同铺开繁华中的衰败。阅读时顺着人物关系慢慢进入</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">，比急于为每个人下一个结论，更能感受作品的层次。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>