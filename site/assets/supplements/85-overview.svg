<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">额尔古纳河右岸</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">迟子建</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">当一种生活方式渐渐远去，记忆怎样留下它？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">一位年迈的鄂温克族女性回望自己与族人的生活，森林、驯鹿、迁</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">徙和亲人的生死交织成悠长叙述。迟子建把人与自然的关系写进具</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">体日常，也呈现外部世界变化带来的冲击。作品中的记忆既保存一</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">个共同体的生活纹理，也流露对生命流逝的深切感受。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>