<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">我们都应该做女性主义者</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">奇玛曼达·恩戈兹·阿迪契</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">从日常小事开始，怎样看见习以为常的性别规则？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">阿迪契把同名演讲扩展成短篇论述，从自己的生活经验出发，讨论</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">性别如何影响机会、期待与自我表达。她把抽象的平等问题放进餐</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">厅、家庭和工作等熟悉情境，追问孩子为何被教成不同的样子，也</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">邀请所有人参与改变那些限制人的规则。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>