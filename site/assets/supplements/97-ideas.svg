<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">人性的弱点</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">戴尔·卡耐基</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">真诚关注具体的人</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">愿意记住对方关心的事情，比套用客气话更能建立联系。关注应来自真</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">实的好奇和尊重，也要允许彼此有不同的兴趣。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">先听清再表达</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">急着反驳时，很容易错过对方真正的担忧。复述自己听到的意思，确认</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">理解之后，再清楚表达自己的观点与需要。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">尊重中保留边界</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">体谅他人并不意味着无条件答应。清楚而平和地说明限制，既能减少误</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">解，也能让关系建立在更真实的相处之上。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>