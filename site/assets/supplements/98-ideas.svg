<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">解忧杂货店</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">东野圭吾</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">烦恼背后的选择</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">来信表面上是在寻求答案，背后往往有不愿放弃的关系和愿望。阅读时</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">留意求助者真正想守住什么，以及他们承受的代价。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">回应也改变倾听者</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">写回信的人并不拥有完美的人生。努力理解别人时，他们也重新看见自</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">己的处境，故事由此形成相互影响的关系。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">留意交错的时间线</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">人物之间的关联并非一次揭晓。把信件、年代与出现过的人记下来，可</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">以更清楚地看见叙事如何把不同人生连接起来。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>