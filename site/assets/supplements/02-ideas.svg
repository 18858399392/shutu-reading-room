<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">万历十五年</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">黄仁宇</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">从人物进入制度</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">不要只用忠奸判断人物。把他们面对的财政、官僚和礼制问题放在一起</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">，才能理解为什么个人努力常常无法改变结果。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">道德之外看技术</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">当复杂事务主要依赖道德评价来协调，具体的财政统计、组织协作与执</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">行办法便容易被遮蔽，这是本书重要的观察角度。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">小年份里的大结构</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">一个年份可以成为观察长期结构的切口。读人物命运时，反复追问哪些</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">问题在他们之前已经存在，又会在他们之后延续。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>