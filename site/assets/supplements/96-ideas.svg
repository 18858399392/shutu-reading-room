<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">学会提问</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">尼尔·布朗、斯图尔特·基利</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">先找结论与理由</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">一段话可能充满故事和情绪，却没有清楚的论证。先指出作者要你接受</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">的结论，再把真正支持它的理由逐条列出来。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">检查没有说的前提</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">同一事实可能导向不同判断，因为背后使用了不同假设与价值。把隐含</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">前提说出来，争论才有可能进入真正的分歧。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">给证据安排位置</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">个案、统计和专家判断各有用途，也各有局限。追问样本、替代解释和</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">遗漏的信息，避免让证据承担超出其能力的结论。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>