<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">追风筝的人</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">卡勒德·胡赛尼</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">友谊并不总平等</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">亲密可以与身份差异同时存在。观察谁拥有选择、谁承担代价，能够理</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">解两人的关系为何既有温情，又有难以忽略的失衡。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">记忆会塑造现在</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">童年的沉默与选择没有随着离开故乡而消失。故事展示过去怎样继续影</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">响关系，也让人物必须重新理解自己曾经的行为。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">赎罪需要行动</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">悔恨本身不能撤销伤害。小说把修复放在具体的人与责任面前，同时保</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">留已经发生的失去，让希望不至于抹平痛苦。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>