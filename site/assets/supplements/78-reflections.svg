<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e2eaf1"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">一九八四</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">乔治·奥威尔</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">把问题带进书里</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">回到书里的细节</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">作者如何展开“记录决定可说的过去”？选一个具体的人物、证据或情</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">境，说明你读到的意思。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">换一个角度看</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">如果换一种立场或处境，你会怎样理解“语言影响思考空间”？找出仍</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">然需要追问的地方。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">联系自己的生活</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">关于“私人关系也会受压”，你的经历能补充什么？把认同与疑问记下</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">，留待下一次翻阅。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>