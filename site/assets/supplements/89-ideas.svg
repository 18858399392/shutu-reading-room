<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">时间简史</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">斯蒂芬·霍金</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">时间与空间联系在一起</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">现代物理并不把时间看作独立于一切的统一背景。跟随书中对相对论的</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">介绍，可以逐步理解观察者、运动和引力的关系。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">黑洞连接两种理论</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">黑洞把强引力与量子效应带到同一个问题中。霍金讨论的辐射思想，让</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">黑洞的温度和长期演化成为新的研究方向。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">模型要与证据相遇</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">关于宇宙的宏大想象，需要数学模型与观测共同检验。阅读时分清已获</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">支持的认识、理论推论和仍在探索的问题，理解会更扎实。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>