<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">杀死一只知更鸟</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">哈珀·李</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">当周围人都认定一件事，你还愿意认真看证据吗？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">女孩斯库特回忆美国南方小镇的童年，父亲阿蒂克斯为一名受到指</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">控的黑人男子辩护，使孩子逐渐看见熟悉生活中的偏见与不公。邻</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">里的传闻、法庭上的证言和家庭里的教导相互交织。成长在这里意</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">味着学会理解他人，也开始辨认群体判断的局限。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>