<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">事实</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">汉斯·罗斯林、欧拉·罗斯林、安娜·罗斯林·伦朗德</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">先检查分类尺度</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">把世界分成两个整齐的阵营，容易抹掉中间的大多数。观察收入、健康</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">与教育时，先看分布和变化，再决定怎样分类。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">数字需要比较对象</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">一个很大的数字未必说明风险很高。补上人口、时间和发生次数等分母</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">，再与合适的对象比较，判断才有可靠的尺度。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">更新脑中的世界</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">熟悉的故事可能来自很久以前。读到令人震惊的说法，追问数据何时采</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">集、覆盖哪些人，以及是否存在不同方向的证据。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>