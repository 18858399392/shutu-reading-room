<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">反脆弱</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">纳西姆·尼古拉斯·塔勒布</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">面对变化，怎样理解受损、承受与受益？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">塔勒布把面对冲击会受损的脆弱、能承受冲击的强韧，以及可能从</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">波动中受益的反脆弱区分开来。他借生活、制度和风险案例，讨论</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">小规模试错、选择权与过度干预的代价。阅读时可以追问，一个系</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">统怎样应对未知，风险最终又由谁承担。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>