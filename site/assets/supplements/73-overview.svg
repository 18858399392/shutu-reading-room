<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">霍乱时期的爱情</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">加夫列尔·加西亚·马尔克斯</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">激情、婚姻与漫长等待，分别构成了怎样的爱？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">弗洛伦蒂诺、费尔明娜与乌尔比诺医生的人生，呈现青春迷恋、日</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">常婚姻与衰老中的欲望。马尔克斯把爱情放进疾病、阶层和时间之</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">中，使它同时显出动人、滑稽与自欺的一面。这不是单一的忠贞传</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">奇，而是一场关于爱如何被讲述和经历的追问。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>