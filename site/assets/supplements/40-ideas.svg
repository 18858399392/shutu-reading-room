<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">枪炮、病菌与钢铁</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">贾雷德·戴蒙德</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">追问更早的条件</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">面对征服与技术差距，作者继续追问农业、人口和资源如何形成。把眼</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">前的结果向前追溯，可以发现长期累积的影响。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">环境影响传播路径</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">大陆形状、气候带与生物资源，会影响农业和技术传播的难易。这是一</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">种宏观解释，不能直接代替对具体社会的分析。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">框架需要相互检验</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">一个覆盖全球的模型必然压缩差异。阅读时既可借用它提出问题，也要</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">留意制度、文化和历史偶然性在具体案例中的作用。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>