<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">三体</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">刘慈欣</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">当人类第一次面对外星文明，团结为何如此困难？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">从一项秘密工程与异常的科学现象开始，刘慈欣把个人选择推向文</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">明之间的相遇。首部《三体》聚焦接触与危机的形成；此后的《黑</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">暗森林》《死神永生》继续扩展尺度。系列以科学想象组织悬念，</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">也追问猜疑、合作和生存压力怎样改变价值判断。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>