<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">活着</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">余华</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">经历一次次失去，人为什么仍要继续生活？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">福贵在晚年讲述自己从富家少爷到普通农民的经历，亲人离散与时</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">代变化交织成漫长的一生。余华以克制的叙述保存日常中的温情，</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">也让接连而来的失去显得沉重。小说追问生命如何承受遭遇，却不</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">把苦难本身当作值得赞美的事。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>