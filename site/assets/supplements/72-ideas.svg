<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">百年孤独</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">加夫列尔·加西亚·马尔克斯</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">名字是阅读线索</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">家族中的名字反复出现，人物却并不相同。随手记录亲子关系、重要经</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">历和性格特征，可以减少混淆，也看见代际之间的回声。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">奇异与日常并置</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">叙述者常以平静语气讲不可思议的事。先接受这种讲述方式，再观察它</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">如何让历史经验、传说和个人感受进入同一个世界。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">记忆抵抗遗忘</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">私人记忆与公共历史不断遭到遗忘和改写。留意谁在记录、谁被迫沉默</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">，能够读出家族故事之外更广阔的历史层面。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>