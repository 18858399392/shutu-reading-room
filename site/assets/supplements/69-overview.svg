<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">许三观卖血记</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">余华</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">当生活逼近底线，亲情怎样超越血缘的计算？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">许三观靠卖血应对成家、饥饿和疾病等生活难关，身体由此成为一</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">个家庭抵御困境的最后资源。重复的卖血经历既带着荒诞与幽默，</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">也积累着疼痛。余华围绕血缘、尊严和父亲的承担，写普通人如何</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">在艰难处境中维持生活与关系。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>