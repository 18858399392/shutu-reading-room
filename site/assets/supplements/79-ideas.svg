<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">动物农场</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">乔治·奥威尔</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">规则由谁来解释</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">共同制定的原则需要持续接受检验。当解释规则的权力集中到少数人手</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">中，文字即使看似相同，实际含义也可能逐渐改变。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">语言怎样塑造记忆</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">口号、重复和选择性的叙述，会影响动物理解过去与现在的方式。阅读</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">时可以比较实际发生的事，与后来被宣布的版本。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">权力需要持续约束</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">推翻旧主人并不自动带来平等。谁掌握信息、资源和强制力量，其他成</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">员能否质疑决定，会继续影响共同生活的方向。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>