<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">三体</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">刘慈欣</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">从疑问追到文明</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">开篇的异常现象与游戏谜题逐渐指向更大的危机。跟随线索理解人物掌</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">握的信息，能够保留首部小说层层展开的悬念。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">危机暴露不同立场</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">面对同一种未知，有人欢迎、有人抗拒，也有人试图理解。不同回应与</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">人物经历相连，让文明选择始终包含个人的伤口与判断。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">区分设定与科学</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">作品借用物理概念，并加入服务叙事的虚构设定。欣赏想象的同时，可</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">以把真实理论、合理推演与小说假设分别辨认。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>