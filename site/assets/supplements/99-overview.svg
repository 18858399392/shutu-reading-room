<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">白夜行</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">东野圭吾</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">当两个主角始终沉默，真相从哪里浮现？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">一桩发生在大阪的命案，牵出两个孩子此后漫长而隐秘的人生。东</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">野圭吾借周围人物的目光与一连串事件，让读者逐步拼合关系与动</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">机。叙事少有两位主角直接的内心独白，悬念因此持续积累，也把</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">创伤、欲望与代价留在沉默之中供人辨认。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>