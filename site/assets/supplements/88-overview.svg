<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">自私的基因</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">理查德·道金斯</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">从基因延续的角度，怎样理解竞争与合作？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">道金斯以基因为观察自然选择的重要视角，解释生物的行为和特征</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">如何影响遗传信息的延续，也讨论亲缘、合作与利他现象。标题中</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">的自私是一种解释性的比喻，基因没有意图。全书帮助读者换一个</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">尺度理解演化，并辨认生物学解释与人的道德选择之间的区别。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>