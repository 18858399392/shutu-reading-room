<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">终身成长</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">卡罗尔·德韦克</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">一次失败，说明能力的终点还是学习的起点？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">心理学家德韦克讨论人们如何理解能力：把它看作固定的标签，或</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">看作能够借助学习、策略和支持逐步发展的东西。书中通过教育、</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">运动和工作案例，分析这种看法如何影响挑战、反馈与挫折。成长</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">型思维并非只要努力，而是愿意调整方法并从结果中学习。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>