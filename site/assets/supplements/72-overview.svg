<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">百年孤独</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">加夫列尔·加西亚·马尔克斯</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">一个家族为何在反复变化中，重演相似的孤独？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">布恩迪亚家族的数代人生，与马孔多从建立到兴衰的历史交织。战</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">争、欲望、遗忘和突如其来的奇异事件，被叙述为同样真实的生活</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">。马尔克斯把家庭记忆与拉丁美洲经验编在一起，让时间像不断回</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">返的河流，映照亲密关系中的隔绝与失语。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>