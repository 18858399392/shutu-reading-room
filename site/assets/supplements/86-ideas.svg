<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">沉默的大多数</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">王小波</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">追问判断的根据</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">一个说法被反复强调，并不等于它已经得到证明。区分事实、推理与情</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">绪，能让讨论从表态走向对问题本身的理解。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">留意没有发声的人</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">公开说出的意见不一定代表所有人的经验。谁有表达机会、谁选择或被</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">迫沉默，会影响我们看到的公共讨论。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">用幽默保持观察距离</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">反讽让习以为常的语言显出荒诞，也给读者重新思考的空间。阅读时可</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">以留意笑意背后指向的逻辑矛盾与现实处境。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>