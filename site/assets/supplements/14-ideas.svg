<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">原子习惯</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">詹姆斯·克利尔</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">让起步足够容易</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">把想做的事缩小到可以立即开始的一步，例如先打开书读一页。降低启</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">动阻力，比一开始规定很大的任务量更容易持续。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">让环境发出提示</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">把需要的用品放到顺手可见的位置，把容易分心的诱因移远。环境设计</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">是在改变行为发生的条件，而不只是提醒自己自律。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">用系统支持身份</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">先问自己想成为怎样的人，再为它安排可以反复完成的小行动。关注是</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">否持续践行，而不把一次中断当作对自己的最终评价。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>