<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">纳瓦尔宝典</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">埃里克·乔根森编；纳瓦尔·拉维坎特述</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">积累可以复用的能力</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">学习、判断和信誉往往随着实践不断积累。与其只盯着即时结果，可以</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">观察自己正在形成哪些能够长期使用的能力。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">选择适合自己的路</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">个人特长来自兴趣、经验与长期投入的结合。借鉴他人路径时，需要辨</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">认自身条件，避免把成功叙述当作人人适用的流程。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">重新辨认生活目标</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">成就和幸福并不自动同步。定期检查自己追逐的目标来自哪里、带来什</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">么代价，可以帮助工作安排更贴近真实需要。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>