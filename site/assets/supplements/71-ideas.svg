<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">围城</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">钱锺书</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">欲望总在移动</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">人物往往先向往一种身份或关系，进入之后又发现不满。留意期待从何</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">而来，以及获得之后为什么并没有解决原来的困惑。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">讽刺也照见读者</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">人物的虚荣和自我辩护并不总是陌生的。读到令人发笑的场景时，可以</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">再想一步：自己是否也曾使用类似的理由。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">语言参与刻画人物</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">新奇比喻与尖锐评论不仅制造笑点，也暴露人物关系和心理。慢读一段</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">对话，观察表面的客气与实际的较量怎样同时发生。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>