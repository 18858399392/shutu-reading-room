<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">平凡的世界</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">路遥</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">兄弟走不同道路</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">少安与少平有不同的责任、愿望和机会。比较他们的选择时，先看各自</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">需要回应什么，才能理解道路为何逐渐分开。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">劳动连接个人与社会</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">田地、工地和矿井不只是故事背景，也塑造人物的身体感受、人际关系</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">与价值判断。劳动的具体细节是理解人物的入口。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">理想需要现实条件</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">奋斗令人动容，但机会、家庭负担和制度变化同样影响结果。把这些条</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">件与个人努力一起阅读，人物才不会变成空泛口号。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>