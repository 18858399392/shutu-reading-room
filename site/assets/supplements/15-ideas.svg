<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">叫魂：1768年中国妖术大恐慌</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">孔飞力</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">追踪谣言的路径</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">同一种传闻在不同地方传播时，会被不同的人赋予意义。关注谁相信、</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">谁受指控、谁从中获得权力，比只问谣言真假更深入。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">制度影响信息</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">地方官与皇帝面对不同的责任和风险，因此可能选择不同的报告方式。</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">信息在层层传递中，受到官僚关系和政治压力塑造。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">看见被排斥的人</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">流动者和社会边缘群体更容易承受无证据的怀疑。阅读事件时，留意恐</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">惧如何寻找替罪者，以及指控怎样改变普通人的处境。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>