<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">解忧杂货店</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">东野圭吾</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">写给陌生人的一封信，会怎样改变彼此？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">三个年轻人躲进一间停业的杂货店，意外收到穿越时间而来的烦恼</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">信件。随着回信与往事交错，原本看似独立的人生逐渐显出联系。</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">东野圭吾把悬念、选择与善意放在同一个故事里，让读者观察一段</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">认真倾听的回应，如何成为他人走下去的微小支点。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>