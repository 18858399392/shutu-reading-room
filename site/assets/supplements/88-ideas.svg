<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">自私的基因</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">理查德·道金斯</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">换一个尺度看选择</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">个体会出生和死亡，遗传信息却可能延续许多代。从基因的尺度观察，</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">可以提出与单看个体利益不同的问题。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">合作也可以被解释</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">帮助亲属、反复互动等条件，可能改变一种行为的长期结果。书中的视</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">角并不只讨论竞争，也尝试解释合作与利他的形成。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">比喻不等于道德指令</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">基因没有愿望，演化解释也不要求人按某种方式生活。理解一个行为怎</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">样形成，与判断它是否值得赞同，是不同的问题。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>