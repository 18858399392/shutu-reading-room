<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">一九八四</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">乔治·奥威尔</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">当语言、记忆与私人生活都受控制，人如何保有真实？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">温斯顿在一个严密监视、不断改写记录的社会里工作，尝试保存私</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">人记忆与独立判断。奥威尔通过新话、双重思想和日常恐惧，描画</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">权力如何深入人对现实的理解。小说既是政治寓言，也追问语言、</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">信任与亲密关系为什么关乎一个人的自由。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>