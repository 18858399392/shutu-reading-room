<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">被讨厌的勇气</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">岸见一郎、古贺史健</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">不再把所有评价都背在身上，能怎样生活？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">本书以青年与哲人的对话介绍阿德勒心理学的若干观点，围绕人际</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">关系、课题分离、认可需求与共同体感觉展开。它用鲜明的论辩鼓</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">励读者重新考虑自身选择。阅读时可以把这些概念当作思考工具，</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">并结合真实关系中的责任、资源和边界理解。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>