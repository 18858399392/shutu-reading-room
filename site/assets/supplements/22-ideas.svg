<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">我们都应该做女性主义者</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">奇玛曼达·恩戈兹·阿迪契</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">从具体场景辨认偏差</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">谁被默认拥有权威，谁的成功需要额外解释，谁又承担更多照护？把目</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">光放回日常场景，性别规则就能变成可以讨论的问题。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">教育塑造可想象的未来</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">对男孩和女孩的不同要求，会影响他们表达情绪、追求目标和理解责任</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">。检查这些期待，可以为孩子留下更多选择空间。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">改变需要共同参与</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">平等关系并不只关乎某一类人的利益。调整工作、家庭和交往中的惯例</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">，需要不同的人共同检视自身习惯，并落实具体行动。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>