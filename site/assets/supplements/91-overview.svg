<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">贫穷的本质</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">阿比吉特·班纳吉、埃斯特·迪弗洛</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">理解贫穷，为什么要从一个个小问题开始？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">两位经济学家把目光放在贫困人群的日常选择：如何吃饭、就医、</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">上学、储蓄和借款。书中结合实地研究与随机对照实验，检验常见</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">政策判断。它让抽象的贫穷变成一组可以细察的问题，也提醒读者</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">把人的决定放回资源、信息和制度限制之中。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>