<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">金钱心理学</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">摩根·豪泽尔</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">经历塑造风险感受</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">不同年代、家庭和职业中的经验，会改变一个人对风险的理解。讨论金</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">钱选择时，先承认每个人看到的世界并不相同。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">给不确定性留余地</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">计划需要面对无法准确预见的变化。理解风险、运气和生存空间的作用</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">，比把偶然成功当成普遍规律更有价值。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">想清楚什么叫足够</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">追逐更多容易失去边界。区分外在比较与真实需要，才能看见金钱在时</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">间、自主和生活安稳中可以发挥的作用。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>