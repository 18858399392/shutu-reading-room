<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">傲慢与偏见</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">简·奥斯汀</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">我们怎样在第一印象里误解一个人？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">伊丽莎白与达西的相识，伴随着阶层差异、家庭期待和一连串误解</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">。奥斯汀以机敏的对话描绘婚姻选择，也让财产、名声与女性处境</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">进入故事。人物必须重新检查自己的判断，感情才可能继续发展；</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">读者也在交往细节中看见偏见如何形成与松动。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>