<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">蛤蟆先生去看心理医生</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">罗伯特·戴博德</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">为情绪找到具体名字</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">只说自己不好，往往难以继续理解。把感受辨认为害怕、委屈、愤怒或</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">失落，可以帮助人更准确地描述正在经历的事情。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">观察熟悉的互动模式</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">故事中的自我状态是一种理解沟通的模型。留意自己何时习惯命令、讨</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">好或退缩，可以帮助观察关系中反复出现的模式。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">让过去与现在分开</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">早年经验可能影响眼前的反应，但成年生活也提供新的选择。蛤蟆的变</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">化体现为逐渐理解自己，并尝试承担适合自己的行动。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>