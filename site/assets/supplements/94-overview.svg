<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">高效能人士的七个习惯</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">史蒂芬·柯维</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">怎样让每天的行动，靠近真正重视的事情？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">柯维把个人成长与人际合作放进一套习惯框架：从主动选择、明确</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">方向和安排要事，逐步走向互利、理解、协作与持续更新。书中强</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">调行动背后的原则与责任。读者可以结合真实生活，检查时间花在</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">哪里、承诺如何落实，以及合作中有哪些尚未被理解的需要。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>