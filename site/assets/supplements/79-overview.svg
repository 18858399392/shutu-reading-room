<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">动物农场</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">乔治·奥威尔</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">共同争取的平等，为什么会悄悄改变模样？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">农场里的动物赶走主人，希望建立平等的新生活，随后却在分工、</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">规则与权力的变化中走向另一种秩序。奥威尔借一则看似简单的动</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">物寓言，写理想如何被语言、记忆和利益重新解释。故事篇幅不长</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">，值得留意每次规则改变时，谁有权说明原因。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>