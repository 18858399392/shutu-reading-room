<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">时间简史</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">斯蒂芬·霍金</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">时间、黑洞与宇宙起源，怎样成为可以研究的问题？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">霍金用面向普通读者的语言，介绍时空、宇宙膨胀、黑洞与时间方</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">向，并讨论量子理论和引力理论相遇时的问题。全书带读者认识现</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">代宇宙学怎样提出假设、寻找证据，也展示当时对统一理论的探索</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">。它适合作为理解这些问题如何形成的阅读入口。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>