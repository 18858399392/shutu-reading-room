<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">小王子</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">安托万·德·圣埃克苏佩里</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">一朵普通的玫瑰，为什么会成为独一无二的牵挂？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">一位迫降沙漠的飞行员，遇见来自小小星球的王子。王子讲述旅行</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">中见过的大人、与玫瑰的牵挂，以及狐狸带来的关系经验。简洁的</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">故事让占有、虚荣与忙碌显得陌生，也让陪伴、责任和离别重新获</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">得分量，适合在不同年龄反复阅读。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>