<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">高效能人士的七个习惯</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">史蒂芬·柯维</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">先明确重要的事</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">忙碌并不自动指向理想生活。把长期重视的关系、责任与目标写清楚，</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">再审视日程中哪些行动真正与它们有关。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">在回应中练习主动</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">外界刺激与自己的回应之间，常有可以思考的空间。辨认能够影响的事</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">情，并为自己的选择承担责任，是主动性的起点。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">合作从理解开始</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">在表达方案前，先努力理解对方的处境与关注。互利的结果需要共同解</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">决问题，也需要双方愿意持续维护信任。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>