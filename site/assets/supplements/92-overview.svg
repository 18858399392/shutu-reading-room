<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">金钱心理学</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">摩根·豪泽尔</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">同样面对金钱，为什么人会做出不同决定？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">摩根·豪泽尔用一组关于财富与行为的故事，讨论经历、运气、风</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">险、耐心和欲望怎样塑造金钱决策。书中把注意力放在人的行为，</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">而不只是计算方法。读者可以借此辨认自己对安全感、成功与足够</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">的理解，思考怎样让金钱安排服务于真正重视的生活。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>