<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">平凡的世界</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">路遥</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">普通青年怎样在时代变化中寻找自己的位置？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">小说以孙少安、孙少平兄弟的成长为主线，展开二十世纪七八十年</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">代城乡生活的变化。土地、劳动、求学和爱情彼此牵连，个人理想</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">始终面对现实条件。路遥让普通人的努力进入宽广的社会图景，也</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">写出尊严如何在并不轻松的日常中建立。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>