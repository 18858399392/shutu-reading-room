<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">红楼梦</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">曹雪芹（通行本后四十回续作者有争议）</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">从日常辨认家族秩序</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">谁能说话、谁承担劳作、谁安排婚事，都透露着家族内部的位置。看似</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">琐碎的生活细节，也是权力和资源如何分配的线索。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">每个人都有自身处境</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">人物既受到身份和关系限制，也保有不同的愿望与判断。把言行放回具</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">体场景，往往比简单划分善恶更接近作品的复杂性。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">繁华与消逝相互映照</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">盛宴、园林和诗意生活并非静止的背景。它们与家族开支、人事变化和</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">情感离散相互映照，使失去的过程更可感。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>