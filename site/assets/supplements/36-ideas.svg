<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">把自己当回事儿</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">杨天真</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">先认识自己的需要</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">重要的选择不能只依据别人眼中的体面。把自己想要的生活、愿意付出</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">的代价写清楚，行动才有可以检验的方向。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">把需求表达清楚</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">别人未必能猜中你的期待。沟通时说清目标、事实和需要的支持，比等</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">待理解或压抑不满更有助于推进事情。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">让行动修正判断</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">自信可以在尝试和反馈中积累。把大目标拆成可执行的一步，再观察结</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">果，逐渐形成对自身能力更准确的认识。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>