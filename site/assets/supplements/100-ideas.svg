<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e6e1f0"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">撒哈拉的故事</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">三毛</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">三个阅读线索</text><circle cx="111" cy="568" r="8" fill="#b3a4cf"/><text x="158" y="578" fill="#29243f" font-size="32" font-weight="600">日常让远方具体</text><text x="158" y="641" fill="#625c70" font-size="27" font-weight="400">食物、住所、工作和邻里相处，把抽象的远方变成可以感知的生活。留</text><text x="158" y="688" fill="#625c70" font-size="27" font-weight="400">意细节怎样让环境进入故事，而不只充当风景。</text><circle cx="111" cy="787" r="8" fill="#b3a4cf"/><text x="158" y="797" fill="#29243f" font-size="32" font-weight="600">好奇也需要尊重</text><text x="158" y="860" fill="#625c70" font-size="27" font-weight="400">面对不同习俗时，叙述者既感到新鲜，也会产生误解。把个人见闻与对</text><text x="158" y="907" fill="#625c70" font-size="27" font-weight="400">整个群体的判断区分开，有助于更仔细地阅读。</text><circle cx="111" cy="1006" r="8" fill="#b3a4cf"/><text x="158" y="1016" fill="#29243f" font-size="32" font-weight="600">用行动安排生活</text><text x="158" y="1079" fill="#625c70" font-size="27" font-weight="400">故事中的自由并不只有出发，也包含面对琐事、困难和关系时的选择。</text><text x="158" y="1126" fill="#625c70" font-size="27" font-weight="400">阅读这些日常，可以思考自己愿意怎样生活。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>