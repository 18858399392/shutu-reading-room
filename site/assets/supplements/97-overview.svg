<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#ded8ee"/><rect x="48" y="48" width="1104" height="1504" rx="14" fill="#ffffff"/><path d="M96 118h96" stroke="#6554a4" stroke-width="6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="96" y="170.0" fill="#6554a4" font-size="24" font-weight="400">一书三图  /  原创导读</text><text x="96" y="285" fill="#29243f" font-size="58" font-weight="600">人性的弱点</text><text x="96" y="378" fill="#716c80" font-size="26" font-weight="400">戴尔·卡耐基</text><text x="96" y="493" fill="#6554a4" font-size="34" font-weight="600">从这里读起</text><text x="96" y="578" fill="#29243f" font-size="37" font-weight="500">怎样让人与人之间的沟通少一点防备？</text><text x="96" y="686" fill="#625c70" font-size="30" font-weight="400">卡耐基从日常交往中的认可、尊重和表达谈起，讨论倾听、理解他</text><text x="96" y="740" fill="#625c70" font-size="30" font-weight="400">人立场，以及在分歧中维护关系的方法。书中大量案例带有成书时</text><text x="96" y="794" fill="#625c70" font-size="30" font-weight="400">代的背景，阅读时适合辨认其中仍然有用的沟通原则。把注意力放</text><text x="96" y="848" fill="#625c70" font-size="30" font-weight="400">在真诚与相互尊重上，也要保留自己的边界和判断。</text><path d="M96 1443h1008" stroke="#dfdce9"/><text x="96" y="1490.0" fill="#8b819d" font-size="21" font-weight="400">本站补充整理 · 非书中原文或引语</text></g></svg>