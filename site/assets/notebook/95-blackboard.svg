<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>终身成长 · 黑板图解</title><rect width="1200" height="1600" fill="#6b573d"/><rect x="31" y="31" width="1138" height="1538" rx="5" fill="#153b31" stroke="#a78e63" stroke-width="4"/><rect x="49" y="49" width="1102" height="1502" fill="none" stroke="#cee0c4" stroke-opacity=".13" stroke-width="2"/><path d="M75 75l45 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M212 158l56 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M349 241l67 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M486 324l78 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M623 407l89 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M760 490l100 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M897 573l111 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1034 656l122 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M141 739l133 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M278 822l54 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M415 905l65 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M552 988l76 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M689 1071l87 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M826 1154l98 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M963 1237l109 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1100 1320l120 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M207 1403l131 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M344 1486l52 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M481 149l63 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M618 232l74 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M755 315l85 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M892 398l96 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1029 481l107 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M136 564l118 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M273 647l129 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M410 730l50 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M547 813l61 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M684 896l72 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><text x="90" y="158" font-size="59" fill="#f0ead3" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="title" data-left="65" data-right="1135" data-top="85" data-bottom="310">终身成长</text><text x="92" y="258" font-size="27" fill="#cbd0ac" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="section" data-left="65" data-right="1135" data-top="230" data-bottom="390">黑板图解 / 三条知识分支</text><path d="M148 412V1398" fill="none" stroke="#d5c97c" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="148" cy="457" r="13" fill="#edcf76"/><path d="M161 457H198" stroke="#edcf76" stroke-width="4" stroke-linecap="round"/><text x="220" y="470" font-size="45" fill="#edcf76" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-1" data-left="205" data-right="1110" data-top="415" data-bottom="545">把表现与身份分开</text><path d="M220 492Q600 4961080 491" stroke="#edcf76" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="564" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">一次考试或工作结果，只能反映特定条件下的表现。把</text><text x="220" y="623" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">失败直接解释为自己不行，会遮住仍可改进的知识和策</text><text x="220" y="682" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">略。</text><circle cx="148" cy="797" r="13" fill="#a9d6bb"/><path d="M161 797H198" stroke="#a9d6bb" stroke-width="4" stroke-linecap="round"/><text x="220" y="810" font-size="45" fill="#a9d6bb" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-2" data-left="205" data-right="1110" data-top="755" data-bottom="885">努力需要有效方法</text><path d="M220 832Q600 8361080 831" stroke="#a9d6bb" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="904" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">重复无效做法并不等于成长。把反馈用于检查方法，寻</text><text x="220" y="963" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">找资源和帮助，才能让投入逐渐转化为可以观察的进</text><text x="220" y="1022" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">步。</text><circle cx="148" cy="1137" r="13" fill="#d5c0e4"/><path d="M161 1137H198" stroke="#d5c0e4" stroke-width="4" stroke-linecap="round"/><text x="220" y="1150" font-size="45" fill="#d5c0e4" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-3" data-left="205" data-right="1110" data-top="1095" data-bottom="1225">让反馈指向行动</text><path d="M220 1172Q600 11761080 1171" stroke="#d5c0e4" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="1244" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">与其只给聪明或笨的标签，不如描述具体过程、选择和</text><text x="220" y="1303" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">改进方向。可以行动的反馈，更能帮助人继续面对挑</text><text x="220" y="1362" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">战。</text><text x="90" y="1504" font-size="25" fill="#b9cbb6" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="footer" data-left="65" data-right="1135" data-top="1465" data-bottom="1535">原创图解 · 依据简介与阅读线索整理</text></svg>