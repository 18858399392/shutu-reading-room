<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>原子习惯 · 黑板图解</title><rect width="1200" height="1600" fill="#6b573d"/><rect x="31" y="31" width="1138" height="1538" rx="5" fill="#153b31" stroke="#a78e63" stroke-width="4"/><rect x="49" y="49" width="1102" height="1502" fill="none" stroke="#cee0c4" stroke-opacity=".13" stroke-width="2"/><path d="M75 75l45 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M212 158l56 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M349 241l67 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M486 324l78 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M623 407l89 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M760 490l100 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M897 573l111 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1034 656l122 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M141 739l133 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M278 822l54 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M415 905l65 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M552 988l76 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M689 1071l87 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M826 1154l98 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M963 1237l109 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1100 1320l120 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M207 1403l131 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M344 1486l52 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M481 149l63 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M618 232l74 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M755 315l85 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M892 398l96 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1029 481l107 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M136 564l118 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M273 647l129 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M410 730l50 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M547 813l61 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M684 896l72 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><text x="90" y="158" font-size="59" fill="#f0ead3" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="title" data-left="65" data-right="1135" data-top="85" data-bottom="310">原子习惯</text><text x="92" y="258" font-size="27" fill="#cbd0ac" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="section" data-left="65" data-right="1135" data-top="230" data-bottom="390">黑板图解 / 三条知识分支</text><path d="M148 412V1398" fill="none" stroke="#d5c97c" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="148" cy="457" r="13" fill="#edcf76"/><path d="M161 457H198" stroke="#edcf76" stroke-width="4" stroke-linecap="round"/><text x="220" y="470" font-size="45" fill="#edcf76" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-1" data-left="205" data-right="1110" data-top="415" data-bottom="545">让起步足够容易</text><path d="M220 492Q600 4961080 491" stroke="#edcf76" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="564" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">把想做的事缩小到可以立即开始的一步，例如先打开书</text><text x="220" y="623" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">读一页。降低启动阻力，比一开始规定很大的任务量更</text><text x="220" y="682" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">容易持续。</text><circle cx="148" cy="797" r="13" fill="#a9d6bb"/><path d="M161 797H198" stroke="#a9d6bb" stroke-width="4" stroke-linecap="round"/><text x="220" y="810" font-size="45" fill="#a9d6bb" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-2" data-left="205" data-right="1110" data-top="755" data-bottom="885">让环境发出提示</text><path d="M220 832Q600 8361080 831" stroke="#a9d6bb" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="904" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">把需要的用品放到顺手可见的位置，把容易分心的诱因</text><text x="220" y="963" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">移远。环境设计是在改变行为发生的条件，而不只是提</text><text x="220" y="1022" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">醒自己自律。</text><circle cx="148" cy="1137" r="13" fill="#d5c0e4"/><path d="M161 1137H198" stroke="#d5c0e4" stroke-width="4" stroke-linecap="round"/><text x="220" y="1150" font-size="45" fill="#d5c0e4" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-3" data-left="205" data-right="1110" data-top="1095" data-bottom="1225">用系统支持身份</text><path d="M220 1172Q600 11761080 1171" stroke="#d5c0e4" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="1244" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">先问自己想成为怎样的人，再为它安排可以反复完成的</text><text x="220" y="1303" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">小行动。关注是否持续践行，而不把一次中断当作对自</text><text x="220" y="1362" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">己的最终评价。</text><text x="90" y="1504" font-size="25" fill="#b9cbb6" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="footer" data-left="65" data-right="1135" data-top="1465" data-bottom="1535">原创图解 · 依据简介与阅读线索整理</text></svg>