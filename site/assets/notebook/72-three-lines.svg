<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>百年孤独 · 三句话解读</title><rect width="1200" height="1600" fill="#f8f7f0"/><path d="M75 72H1125V1528H75Z" fill="none" stroke="#d6ded4" stroke-width="2"/><path d="M152 355V1435" stroke="#ded7bf" stroke-width="2"/><text x="90" y="140" font-size="29" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="section" data-left="65" data-right="1135" data-top="90" data-bottom="170">三句话解读</text><text x="90" y="235" font-size="58" fill="#263f36" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="title" data-left="65" data-right="1135" data-top="170" data-bottom="360">百年孤独</text><circle cx="127" cy="417" r="35" fill="#e7ebe0"/><text x="127" y="427" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-1" data-left="85" data-right="170" data-top="375" data-bottom="460">01</text><text x="196" y="430" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">家族中的名字反复出现，人物却并不相同；随手</text><text x="196" y="500" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">记录亲子关系、重要经历和性格特征，可以减少</text><text x="196" y="570" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">混淆，也看见代际之间的回声。</text><path d="M196 686H1090" stroke="#e0e3d9" stroke-width="2"/><circle cx="127" cy="767" r="35" fill="#e7ebe0"/><text x="127" y="777" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-2" data-left="85" data-right="170" data-top="725" data-bottom="810">02</text><text x="196" y="780" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">叙述者常以平静语气讲不可思议的事；先接受这</text><text x="196" y="850" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">种讲述方式，再观察它如何让历史经验、传说和</text><text x="196" y="920" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">个人感受进入同一个世界。</text><path d="M196 1036H1090" stroke="#e0e3d9" stroke-width="2"/><circle cx="127" cy="1117" r="35" fill="#e7ebe0"/><text x="127" y="1127" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-3" data-left="85" data-right="170" data-top="1075" data-bottom="1160">03</text><text x="196" y="1130" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">私人记忆与公共历史不断遭到遗忘和改写；留意</text><text x="196" y="1200" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">谁在记录、谁被迫沉默，能够读出家族故事之外</text><text x="196" y="1270" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">更广阔的历史层面。</text><text x="90" y="1498" font-size="24" fill="#6f7d6d" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="footer" data-left="65" data-right="1135" data-top="1450" data-bottom="1530">原创解读 · 非原书逐字摘录</text></svg>