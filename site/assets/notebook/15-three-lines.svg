<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>叫魂：1768年中国妖术大恐慌 · 三句话解读</title><rect width="1200" height="1600" fill="#f8f7f0"/><path d="M75 72H1125V1528H75Z" fill="none" stroke="#d6ded4" stroke-width="2"/><path d="M152 355V1435" stroke="#ded7bf" stroke-width="2"/><text x="90" y="140" font-size="29" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="section" data-left="65" data-right="1135" data-top="90" data-bottom="170">三句话解读</text><text x="90" y="235" font-size="58" fill="#263f36" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="title" data-left="65" data-right="1135" data-top="170" data-bottom="360">叫魂：1768年中国妖术大恐慌</text><circle cx="127" cy="417" r="35" fill="#e7ebe0"/><text x="127" y="427" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-1" data-left="85" data-right="170" data-top="375" data-bottom="460">01</text><text x="196" y="430" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">同一种传闻在不同地方传播时，会被不同的人赋</text><text x="196" y="500" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">予意义；关注谁相信、谁受指控、谁从中获得权</text><text x="196" y="570" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">力，比只问谣言真假更深入。</text><path d="M196 686H1090" stroke="#e0e3d9" stroke-width="2"/><circle cx="127" cy="767" r="35" fill="#e7ebe0"/><text x="127" y="777" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-2" data-left="85" data-right="170" data-top="725" data-bottom="810">02</text><text x="196" y="780" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">地方官与皇帝面对不同的责任和风险，因此可能</text><text x="196" y="850" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">选择不同的报告方式；信息在层层传递中，受到</text><text x="196" y="920" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">官僚关系和政治压力塑造。</text><path d="M196 1036H1090" stroke="#e0e3d9" stroke-width="2"/><circle cx="127" cy="1117" r="35" fill="#e7ebe0"/><text x="127" y="1127" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-3" data-left="85" data-right="170" data-top="1075" data-bottom="1160">03</text><text x="196" y="1130" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">流动者和社会边缘群体更容易承受无证据的怀</text><text x="196" y="1200" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">疑；阅读事件时，留意恐惧如何寻找替罪者，以</text><text x="196" y="1270" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">及指控怎样改变普通人的处境。</text><text x="90" y="1498" font-size="24" fill="#6f7d6d" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="footer" data-left="65" data-right="1135" data-top="1450" data-bottom="1530">原创解读 · 非原书逐字摘录</text></svg>