ty=".035" stroke-width="2"/><path d="M755 315l85 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M892 398l96 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1029 481l107 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M136 564l118 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M273 647l129 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M410 730l50 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M547 813l61 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M684 896l72 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><text x="90" y="158" font-size="59" fill="#f0ead3" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="title" data-left="65" data-right="1135" data-top="85" data-bottom="310">霍乱时期的爱情</text><text x="92" y="258" font-size="27" fill="#cbd0ac" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="section" data-left="65" data-right="1135" data-top="230" data-bottom="390">黑板图解 / 三条知识分支</text><path d="M148 412V1398" fill="none" stroke="#d5c97c" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="148" cy="457" r="13" fill="#edcf76"/><path d="M161 457H198" stroke="#edcf76" stroke-width="4" stroke-linecap="round"/><text x="220" y="470" font-size="45" fill="#edcf76" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-1" data-left="205" data-right="1110" data-top="415" data-bottom="545">把爱情放回时间</text><path d="M220 492Q600 4961080 491" stroke="#edcf76" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="564" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">青春时的迷恋、婚姻中的相处与晚年的相遇，各有不同</text><text x="220" y="623" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">需要。比较这些阶段，能够看见爱怎样被记忆、身体和</text><text x="220" y="682" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">处境改变。</text><circle cx="148" cy="797" r="13" fill="#a9d6bb"/><path d="M161 797H198" stroke="#a9d6bb" stroke-width="4" stroke-linecap="round"/><text x="220" y="810" font-size="45" fill="#a9d6bb" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-2" data-left="205" data-right="1110" data-top="755" data-bottom="885">等待也可能自欺</text><path d="M220 832Q600 8361080 831" stroke="#a9d6bb" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="904" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">长久的执念可以显得深情，也可能遮蔽他人的意愿和自</text><text x="220" y="963" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">己的行为。小说容纳这种矛盾，需要同时检视动人的表</text><text x="220" y="1022" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">述与实际行动。</text><circle cx="148" cy="1137" r="13" fill="#d5c0e4"/><path d="M161 1137H198" stroke="#d5c0e4" stroke-width="4" stroke-linecap="round"/><text x="220" y="1150" font-size="45" fill="#d5c0e4" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-3" data-left="205" data-right="1110" data-top="1095" data-bottom="1225">日常也是关系内容</text><path d="M220 1172Q600 11761080 1171" stroke="#d5c0e4" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="1244" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">婚姻不只有高潮，也包含习惯、摩擦和彼此依赖。注意</text><text x="220" y="1303" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">这些普通场景，才能理解激情之外的亲密如何被维持或</text><text x="220" y="1362" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">消耗。</text><text x="90" y="1504" font-size="25" fill="#b9cbb6" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="footer" data-left="65" data-right="1135" data-top="1465" data-bottom="1535">原创图解 · 依据简介与阅读线索整理</text></svg>