<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>自私的基因 · 黑板图解</title><rect width="1200" height="1600" fill="#6b573d"/><rect x="31" y="31" width="1138" height="1538" rx="5" fill="#153b31" stroke="#a78e63" stroke-width="4"/><rect x="49" y="49" width="1102" height="1502" fill="none" stroke="#cee0c4" stroke-opacity=".13" stroke-width="2"/><path d="M75 75l45 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M212 158l56 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M349 241l67 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M486 324l78 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M623 407l89 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M760 490l100 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M897 573l111 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1034 656l122 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M141 739l133 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M278 822l54 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M415 905l65 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M552 988l76 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M689 1071l87 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M826 1154l98 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M963 1237l109 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1100 1320l120 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M207 1403l131 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M344 1486l52 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M481 149l63 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M618 232l74 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M755 315l85 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M892 398l96 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M1029 481l107 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M136 564l118 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M273 647l129 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M410 730l50 0" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M547 813l61 1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><path d="M684 896l72 -1" stroke="#e4e9d5" stroke-opacity=".035" stroke-width="2"/><text x="90" y="158" font-size="59" fill="#f0ead3" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="title" data-left="65" data-right="1135" data-top="85" data-bottom="310">自私的基因</text><text x="92" y="258" font-size="27" fill="#cbd0ac" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="section" data-left="65" data-right="1135" data-top="230" data-bottom="390">黑板图解 / 三条知识分支</text><path d="M148 412V1398" fill="none" stroke="#d5c97c" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="148" cy="457" r="13" fill="#edcf76"/><path d="M161 457H198" stroke="#edcf76" stroke-width="4" stroke-linecap="round"/><text x="220" y="470" font-size="45" fill="#edcf76" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-1" data-left="205" data-right="1110" data-top="415" data-bottom="545">换一个尺度看选择</text><path d="M220 492Q600 4961080 491" stroke="#edcf76" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="564" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">个体会出生和死亡，遗传信息却可能延续许多代。从基</text><text x="220" y="623" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-1" data-left="205" data-right="1110" data-top="520" data-bottom="755">因的尺度观察，可以提出与单看个体利益不同的问题。</text><circle cx="148" cy="797" r="13" fill="#a9d6bb"/><path d="M161 797H198" stroke="#a9d6bb" stroke-width="4" stroke-linecap="round"/><text x="220" y="810" font-size="45" fill="#a9d6bb" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-2" data-left="205" data-right="1110" data-top="755" data-bottom="885">合作也可以被解释</text><path d="M220 832Q600 8361080 831" stroke="#a9d6bb" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="904" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">帮助亲属、反复互动等条件，可能改变一种行为的长期</text><text x="220" y="963" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">结果。书中的视角并不只讨论竞争，也尝试解释合作与</text><text x="220" y="1022" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-2" data-left="205" data-right="1110" data-top="860" data-bottom="1095">利他的形成。</text><circle cx="148" cy="1137" r="13" fill="#d5c0e4"/><path d="M161 1137H198" stroke="#d5c0e4" stroke-width="4" stroke-linecap="round"/><text x="220" y="1150" font-size="45" fill="#d5c0e4" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="branch-title-3" data-left="205" data-right="1110" data-top="1095" data-bottom="1225">比喻不等于道德指令</text><path d="M220 1172Q600 11761080 1171" stroke="#d5c0e4" stroke-opacity=".4" stroke-width="2" fill="none"/><text x="220" y="1244" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">基因没有愿望，演化解释也不要求人按某种方式生活。</text><text x="220" y="1303" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">理解一个行为怎样形成，与判断它是否值得赞同，是不</text><text x="220" y="1362" font-size="35" fill="#ecebd9" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="branch-body-3" data-left="205" data-right="1110" data-top="1200" data-bottom="1435">同的问题。</text><text x="90" y="1504" font-size="25" fill="#b9cbb6" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="footer" data-left="65" data-right="1135" data-top="1465" data-bottom="1535">原创图解 · 依据简介与阅读线索整理</text></svg>