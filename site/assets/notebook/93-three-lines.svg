<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>反脆弱 · 三句话解读</title><rect width="1200" height="1600" fill="#f8f7f0"/><path d="M75 72H1125V1528H75Z" fill="none" stroke="#d6ded4" stroke-width="2"/><path d="M152 355V1435" stroke="#ded7bf" stroke-width="2"/><text x="90" y="140" font-size="29" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="section" data-left="65" data-right="1135" data-top="90" data-bottom="170">三句话解读</text><text x="90" y="235" font-size="58" fill="#263f36" font-family="KaiTi, Microsoft YaHei, sans-serif" font-weight="600" text-anchor="start" data-zone="title" data-left="65" data-right="1135" data-top="170" data-bottom="360">反脆弱</text><circle cx="127" cy="417" r="35" fill="#e7ebe0"/><text x="127" y="427" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-1" data-left="85" data-right="170" data-top="375" data-bottom="460">01</text><text x="196" y="430" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">不被打垮与因变化而改善，是不同的性质；判断</text><text x="196" y="500" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">系统时，要观察它面对多次冲击后的实际变化，</text><text x="196" y="570" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-1" data-left="180" data-right="1110" data-top="383" data-bottom="697">而不只看一次表现。</text><path d="M196 686H1090" stroke="#e0e3d9" stroke-width="2"/><circle cx="127" cy="767" r="35" fill="#e7ebe0"/><text x="127" y="777" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-2" data-left="85" data-right="170" data-top="725" data-bottom="810">02</text><text x="196" y="780" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">一些探索能把损失限制在局部，却保留发现新机</text><text x="196" y="850" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">会的可能；关键在于识别边界，避免把无法承受</text><text x="196" y="920" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-2" data-left="180" data-right="1110" data-top="733" data-bottom="1047">的风险伪装成勇敢尝试。</text><path d="M196 1036H1090" stroke="#e0e3d9" stroke-width="2"/><circle cx="127" cy="1117" r="35" fill="#e7ebe0"/><text x="127" y="1127" font-size="25" fill="#567561" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="middle" data-zone="number-3" data-left="85" data-right="170" data-top="1075" data-bottom="1160">03</text><text x="196" y="1130" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">提出方案的人若不承担失败代价，决策就可能偏</text><text x="196" y="1200" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">离实际后果；阅读制度案例时，留意收益与损失</text><text x="196" y="1270" font-size="42" fill="#34483e" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="body-3" data-left="180" data-right="1110" data-top="1083" data-bottom="1397">是否落在同一批人身上。</text><text x="90" y="1498" font-size="24" fill="#6f7d6d" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-weight="400" text-anchor="start" data-zone="footer" data-left="65" data-right="1135" data-top="1450" data-bottom="1530">原创解读 · 非原书逐字摘录</text></svg>